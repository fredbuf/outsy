<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Outsy — Event Submission</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1a1a1a; font-family: Inter, -apple-system, system-ui, sans-serif; }
    body { overflow: hidden; }
    input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.32); }
    /* hide scrollbars in artboards */
    .dc-card *::-webkit-scrollbar { display: none; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="event-submission.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "filled": false
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const filled = t.filled;

      return (
        <React.Fragment>
          <DesignCanvas>
            <DCSection
              id="variants"
              title="Outsy · Event Submission"
              subtitle={`Two WYSIWYG reworks · Inter · ${filled ? 'Filled' : 'Empty'} state`}
            >
              <DCArtboard id="a" label="A · Composer card" width={402} height={874}>
                <div data-screen-label="Variant A · Composer">
                  <IOSDevice dark={true}>
                    <VariantA filled={filled} />
                  </IOSDevice>
                </div>
              </DCArtboard>
              <DCArtboard id="b" label="B · Immersive hero" width={402} height={874}>
                <div data-screen-label="Variant B · Immersive">
                  <IOSDevice dark={true}>
                    <VariantB filled={filled} />
                  </IOSDevice>
                </div>
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel title="Tweaks">
            <TweakSection label="State">
              <TweakRadio
                label="Show as"
                value={filled ? 'filled' : 'empty'}
                onChange={(v) => setTweak('filled', v === 'filled')}
                options={[
                  { value: 'empty', label: 'Empty' },
                  { value: 'filled', label: 'Filled' },
                ]}
              />
              <div style={{ fontSize: 12, color: 'rgba(0,0,0,0.55)', lineHeight: 1.45, marginTop: 4, padding: '0 14px 8px' }}>
                Toggle between the blank composer and a filled-in event ("Rooftop Sunset Drinks") to see both flows.
              </div>
            </TweakSection>
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
